<svg width="250" height="350" viewBox="0 0 250 350" xmlns="http://www.w3.org/2000/svg">
  <title>COMMANDOS</title>
  <rect width="250" height="350" fill="black" stroke="white" stroke-width="15"/>
  <text x="125" y="53" fill="white" font-size="28"
        font-family="stop, sans-serif" text-anchor="middle">COMMANDOS</text>
  <rect x="55" y="70" rx="8" ry="5" width="140" height="24" fill="#a40000"/>
  <text x="125" y="87" fill="white" font-size="13" font-family="sans-serif"
        text-anchor="middle">PLANETARY</text>
  <text x="222" y="111" fill="white" font-size="12" font-family="sans-serif"
        text-anchor="end">x2</text>
  <rect x="20" y="120" width="210" height="210" fill="#dedede" stroke="white" stroke-width="3"/>
  <text fill="black" font-size="14" font-family="serif" text-anchor="middle">
    <tspan x="125" y="167">Land up to 3 Infantry from</tspan>
        <tspan x="125" y="191">one friendly surface in an</tspan>
        <tspan x="125" y="215">adjacent system.</tspan>
        <tspan x="125" y="239">No Transport is required.</tspan>
        <tspan x="125" y="263">They fire in ground round 1.</tspan>
  </text>
</svg>
